<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epub Reader</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div id="library-page">
      <header id="library-header">
        <h1>My Library</h1>
        <div id="library-controls">
          <div class="select-wrapper">
            <select id="sort-select">
              <option value="recently-added">Recently Added</option>
              <option value="recently-read">Recently Read</option>
              <option value="a-z">A–Z</option>
              <option value="z-a">Z–A</option>
            </select>
          </div>
          <button id="add-book-btn">+ Add Book</button>
        </div>
      </header>
      <div id="book-grid"></div>
      <div id="empty-library">
        <p>No books yet. Click <strong>+ Add Book</strong> to get started.</p>
      </div>
    </div>
  </body>
</html>
